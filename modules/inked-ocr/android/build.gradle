plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.inkedocr'
version = '0.1.0'

android {
  namespace "expo.modules.inkedocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Latin-script model bundled in the app (works offline, no Google Play services download).
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
